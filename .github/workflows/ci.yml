name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          test -f index.html && echo "✓ index.html"
          test -f three.wasm && echo "✓ three.wasm"

      - name: Validate WASM binary
        run: |
          SIZE=$(wc -c < three.wasm)
          echo "three.wasm size: ${SIZE} bytes"
          test "$SIZE" -gt 0 && echo "✓ WASM binary is valid"
